<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<link rel="manifest" href="/ClueGames/manifest.json">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>ClueGame</title>
	<style>
		html,
		body {
			background: #000;
			width: 100%;
			height: 100%;
			overflow: visible;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
			-webkit-user-select: none;
			user-select: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}

		#confirm-popup {
			position: fixed;
			top: 0; left: 0;
			width: 100vw; height: 100vh;
			background: rgba(0, 0, 0, 0.5);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 9999;
		}

		#confirm-popup .box {
			background: darkgrey;
			color: white;
			font-family: 'Poppins', sans-serif; 
			padding: 20px;
			border-radius: 5px;
			text-align: center;
			box-shadow: 0 5px 20px rgba(0,0,0,0.3);
			max-width: 320px;
		}

		#confirm-popup button {
			margin: 8px;
			padding: 8px 14px;
			border: none;
			border-radius: 6px;
			cursor: pointer;
		}

		#confirm-popup .yes {
			background: #4CAF50;
			color: white;
		}

		#confirm-popup .no {
			background: #f44336;
			color: white;
		}
	</style>
</head>

<body>
	<div id="gameContainer">

		
		<div id="confirm-popup">
			<div class="box">
				<p>Do you want to subscribe to push notifications?</p>
				<button class="yes">Yes</button>
				<button class="no">No</button>
			</div>
		</div>

		<canvas id="unity-canvas" width="720" height="1604" data-pixel-art=""></canvas>
		<script src="Build/ClueGameBuilds.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/ClueGameBuilds.data",
				frameworkUrl: "Build/ClueGameBuilds.framework.js",
				codeUrl: "Build/ClueGameBuilds.wasm",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "DefaultCompany",
				productName: "ClueGame",
				productVersion: "0.1",
				autoSyncPersistentDataPath: true,
			};
			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("");
			} catch (e) {
				scaleToFit = true;
			}

			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}

			function onResize() {
				var container = canvas.parentElement;
				var w;
				var h;

				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;

					var r = 1604 / 720;

					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = 720;
					h = 1604;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
				window.focus();
			}
			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;
				onResize();
			});
			window.addEventListener('resize', onResize);
			onResize();

			if (typeof(Storage) !== "undefined") 
			{
				const test = localStorage.getItem("newUser");
				if(test === true || test == null){
					subscribeUser();
				}
			}

			function showConfirmPopup(message) {
				return new Promise(resolve => {
					const popup = document.getElementById("confirm-popup");
					popup.querySelector("p").textContent = message;
					popup.style.display = "flex";

					const cleanup = (response) => {
						popup.style.display = "none";
						resolve(response);
					};

					const yesButton = popup.querySelector(".yes").addEventListener('click', async () => {
						const permission = await Notification.requestPermission();
						if (permission === 'granted') {
							resolve(true)
						} else {
							resolve(false)
						}
						
						popup.style.display = "none";
					});
					const noButton = popup.querySelector(".no");

					// yesButton.onclick = () => cleanup(true);
					noButton.onclick = () => cleanup(false);
				});
			}

			function OnClick() {
				console.log("Click");
				subscribeUser();
				localStorage.setItem("newUser", true);
			}

			const publicVapidKey = "BBuNo3PX4UUwtPujTBZskCRBVvy9UsHI2Q93hXfW1cGauKZJw4NvGIZVwbqgpUlzoshBKeYuea3nnxjSIDhhVV8";

			async function subscribeUser() {
				const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
				|| window.navigator.standalone 
				|| document.referrer.includes('android-app://');

				if (!isStandalone) {
					alert('Not running as PWA - push notifications require home screen installation');
					return;
				}

				if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
					alert('Push notifications not supported');
					return;
				}

				const confirmed = await showConfirmPopup("Do you want to subscribe to push notifications?");
				if (confirmed) {
					const register = await navigator.serviceWorker.register('/ClueGames/sw.js');

					alert('starting subscription');

					const swRegistration = await navigator.serviceWorker.ready;

					alert('subscription');

					const subscription = await swRegistration.pushManager.subscribe({
						userVisibleOnly: true,
						applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
					})

					await fetch('https://nodejs-serverless-function-express-topaz-mu.vercel.app/api/server', {
						method: 'POST',
						body: JSON.stringify({ subscription }),
						headers: { 'Content-Type': 'application/json' }
					});

					alert('Subscribed for notifications!');
				}
				if (typeof(Storage) !== "undefined") 
				{
					localStorage.setItem("newUser", false);
				}
				
			}

			function urlBase64ToUint8Array(base64String) {
				const padding = '='.repeat((4 - base64String.length % 4) % 4);
				const base64 = (base64String + padding)
					.replace(/-/g, '+')
					.replace(/_/g, '/');
				const rawData = atob(base64);
				return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
			}

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				// Mobile device style: fill the whole browser client area with the game canvas:
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
	</div>
</body>

</html>
